name: Auto Update Check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get current version
      id: version
      run: |
        VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        echo "current=$VERSION" >> $GITHUB_OUTPUT

    - name: Check for latest release
      id: check
      uses: actions/github-script@v7
      with:
        script: |
          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 1
          });
          
          if (releases.data.length > 0) {
            const latest = releases.data[0];
            const latestVersion = latest.tag_name.replace('v', '');
            core.setOutput('latest_version', latestVersion);
            core.setOutput('has_update', latestVersion !== '${{ steps.version.outputs.current }}');
          } else {
            core.setOutput('latest_version', '0.0.0');
            core.setOutput('has_update', 'false');
          }

    - name: Check for existing update issue
      if: steps.check.outputs.has_update == 'true'
      id: existing
      uses: actions/github-script@v7
      with:
        script: |
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'auto-update',
            per_page: 10
          });
          core.setOutput('exists', issues.data.length > 0);

    - name: Create notification
      if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.exists == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `New version available: v${{ steps.check.outputs.latest_version }}`,
            body: `## Update Available\n\nCurrent version: ${{ steps.version.outputs.current }}\nLatest version: ${{ steps.check.outputs.latest_version }}\n\nPlease update to the latest version.`,
            labels: ['update', 'auto-update']
          });
